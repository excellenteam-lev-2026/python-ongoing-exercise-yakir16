[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-explainer-client"
version = "0.1.0"
description = "A Python Client for the Gemini Explainer Web API"
dependencies = [
    "requests>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["client*"]
